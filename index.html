<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f4f3f0" />
    <meta name="description" content="电子学生证正反面展示" />
    <title>电子学生证</title>
    <link rel="stylesheet" href="./styles.css?v=20261020-5" />
    <script src="./config.js?v=20261020-5" defer></script>
    <script src="./app.js?v=20261020-5" defer></script>
  </head>
  <body>
    <main class="page">
      <header class="page-header">
        <div>
          <p class="eyebrow">LE CNAM · CARTE ÉTUDIANTE</p>
          <h1>电子学生证</h1>
          <p class="subtitle">正反面展示 · <span id="page-year">2024/2025</span></p>
        </div>
        <button class="print-button" id="print-button" type="button" aria-label="打印或保存为 PDF">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9V3h12v6M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2M6 14h12v7H6zM18 12h.01"/></svg>
          <span>打印 / 保存 PDF</span>
        </button>
      </header>

      <div class="card-grid" aria-label="学生证正反面">
        <section class="card-panel" aria-labelledby="front-heading">
          <div class="panel-heading"><h2 id="front-heading">正面</h2><span>RECTO</span></div>
          <article class="student-card card-front" aria-label="学生证正面">
            <div class="front-title">CARTE<br />D'ÉTUDIANT</div>
            <div class="brand brand-front" aria-label="le cnam"><span>le&nbsp;</span>cnam</div>
            <div class="student-details">
              <p><strong>Année</strong> <span id="year"></span></p>
              <p><strong>Nom&nbsp;:</strong> <span id="last-name"></span></p>
              <p><strong>Prénom&nbsp;:</strong> <span id="first-name"></span></p>
              <p><strong>Date de naissance&nbsp;:</strong> <span id="birth-date"></span></p>
              <p><strong>N° (INE)&nbsp;:</strong> <span id="ine"></span></p>
              <p><strong>N° (Siscol)&nbsp;:</strong> <span id="siscol"></span></p>
            </div>
            <div class="photo-frame" id="photo-frame" role="img" aria-label="学生照片"></div>
            <div class="barcode" aria-hidden="true"></div>
            <div class="signature-block">
              <span class="signature-label">Administratrice générale du Cnam</span>
              <span class="signature-ink" id="signature-ink" aria-hidden="true"></span>
              <strong id="signatory"></strong>
            </div>
          </article>
        </section>

        <section class="card-panel" aria-labelledby="back-heading">
          <div class="panel-heading"><h2 id="back-heading">背面</h2><span>VERSO</span></div>
          <article class="student-card card-back" aria-label="学生证背面">
            <div class="brand brand-back" aria-label="le cnam"><span>le&nbsp;</span>cnam</div>
            <div class="back-title">CARTE DE <strong>SCOLARITÉ</strong></div>
            <div class="gray-band" aria-hidden="true"></div>
            <div class="back-footer">
              <div><span id="institution"></span><br /><span id="address"></span></div>
              <a id="website" href="https://www.cnam.fr/" target="_blank" rel="noopener noreferrer"></a>
            </div>
          </article>
        </section>
      </div>
      <p class="page-note">可在手机上双指放大查看细节，也可使用浏览器打印功能保存为 PDF。</p>
    </main>
  </body>
</html>
